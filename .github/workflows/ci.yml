name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift tests
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Steam helper SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: SteamHelper/global.json

      - name: Build Steam helper
        run: bash Scripts/build-steam-helper.sh

      - name: Test Steam helper boundaries and protocol
        run: dotnet run --project SteamHelper/tests/SteamHelper.Tests.csproj --configuration Release

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Pick an Xcode for the system wallpaper extension
        shell: bash
        run: |
          xcode="$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)"
          ls -d /Applications/Xcode*.app
          if [ -n "$xcode" ]; then echo "WALLPAPER_EXTENSION_DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"; fi

      - name: Build system wallpaper extension
        run: bash Scripts/build-wallpaper-extension.sh "$RUNNER_TEMP/wallpaper-extension/WorkshopWallpaperBridgeWallpaper"
